services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: urban-parcel-postgis
    environment:
      POSTGRES_USER: parcel
      POSTGRES_PASSWORD: parcel
      POSTGRES_DB: urban_parcel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcel -d urban_parcel"]
      interval: 5s
      timeout: 5s
      retries: 30
